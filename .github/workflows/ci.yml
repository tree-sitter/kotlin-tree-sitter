name: CI

on:
  push:
    branches: [master]
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "**/jni/*"
      - "**/CMakeLists.txt"
      - gradle/**
      - gradle.properties
      - ktreesitter/gradle.lockfile
      - .github/workflows/ci.yml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "**/jni/*"
      - "**/CMakeLists.txt"
      - gradle/**
      - gradle.properties
      - ktreesitter/gradle.lockfile
      - .github/workflows/ci.yml
      - .github/workflows/docs.yml

concurrency:
  cancel-in-progress: true
  group: ${{github.workflow}}-${{github.ref_name}}

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{matrix.os}}
    name: >-
      Test ${{matrix.platform}} platform
      ${{matrix.platform == 'JVM' && format('({0})', matrix.os) || ''}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: JVM
            targets: :ktreesitter:jvmTest
          - os: windows-latest
            platform: JVM
            targets: :ktreesitter:jvmTest
          - os: macos-latest
            platform: JVM
            targets: :ktreesitter:jvmTest
          - os: ubuntu-latest
            platform: Android
            targets: :ktreesitter:emulatorDebugAndroidTest
          - os: ubuntu-latest
            platform: Linux
            targets: >-
              :ktreesitter:compileKotlinLinuxArm64
              :ktreesitter:linuxX64Test
          - os: windows-latest
            platform: Windows
            targets: :ktreesitter:mingwX64Test
          - os: macos-latest
            platform: macOS/iOS
            targets: >-
              :ktreesitter:macosArm64Test
              :ktreesitter:iosSimulatorArm64Test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties
      - name: Set up CMake & Ninja
        uses: lukka/get-cmake@v4.5.0
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        if: startsWith(matrix.os, 'windows') && matrix.platform == 'JVM'
      - name: Cache Kotlin/Native dependencies
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{runner.os}}-${{runner.arch}}-2.4.21
      - name: Set up cross compilation
        if: matrix.platform == 'Linux'
        run: |-
          sudo apt-get update
          sudo apt-get install -qy {binutils,gcc}-aarch64-linux-gnu
      - name: Enable hardware acceleration
        if: matrix.platform == 'Android'
        run: |-
          sudo tee /etc/udev/rules.d/99-kvm4all.rules <<< \
            'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tests
        run: >-
          ./gradlew --no-daemon ${{matrix.targets}}
          -P "android.builder.sdkDownload=${{matrix.platform == 'Android'}}"
      - name: Report test results
        uses: mikepenz/action-junit-report@v6
        if: matrix.platform == 'JVM' && !cancelled()
        with:
          annotate_only: true
          detailed_summary: true
          report_paths: ktreesitter/build/reports/xml/*
